version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MOCK=${MOCK:-1}
      - DEMO_MODE=${DEMO_MODE:-cached}
      - ENABLE_CROSSTALK=${ENABLE_CROSSTALK:-1}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_MODEL_VISION=${LLM_MODEL_VISION:-gemini-2.5-flash}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemini-2.5-pro}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MEKO_MODE=${MEKO_MODE:-local}
      - MEKO_API_KEY=${MEKO_API_KEY:-}
      - MEKO_DATAPACK_ID=${MEKO_DATAPACK_ID:-}
      - MEKO_MCP_URL=${MEKO_MCP_URL:-https://mcp.mekodata.ai/mcp}
      - MEKO_CALL_BUDGET=${MEKO_CALL_BUDGET:-200}
      - MEKO_TIMEOUT_S=${MEKO_TIMEOUT_S:-8}
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
